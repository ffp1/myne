name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::error::Repository secret GOOGLE_SERVICE_INFO_PLIST is missing. See docs/SETUP.md"
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > Myne/GoogleService-Info.plist
          REVERSED=$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' Myne/GoogleService-Info.plist 2>/dev/null || echo "com.googleusercontent.apps.placeholder")
          echo "REVERSED_CLIENT_ID=$REVERSED" >> "$GITHUB_ENV"

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Myne.xcodeproj \
            -scheme Myne \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            REVERSED_CLIENT_ID="$REVERSED_CLIENT_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Myne.app

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Myne.app Payload/
          zip -qry Myne.ipa Payload
          ls -lh Myne.ipa

      - name: Generate SideStore source
        run: |
          SIZE=$(stat -f%z Myne.ipa)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          OWNER="${GITHUB_REPOSITORY%%/*}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Myne.ipa"
          ICON="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/assets/icon.png"
          cat > source.json <<EOF
          {
            "name": "Myne",
            "identifier": "com.myne.source",
            "subtitle": "Myne",
            "iconURL": "${ICON}",
            "tintColor": "#7153C2",
            "apps": [
              {
                "name": "Myne",
                "bundleIdentifier": "com.myne.app",
                "developerName": "${OWNER}",
                "subtitle": "Messages",
                "localizedDescription": "Myne",
                "iconURL": "${ICON}",
                "tintColor": "#7153C2",
                "category": "social",
                "versions": [
                  {
                    "version": "${APP_VERSION}",
                    "buildVersion": "${BUILD_NUMBER}",
                    "date": "${DATE}",
                    "downloadURL": "${URL}",
                    "size": ${SIZE},
                    "minOSVersion": "26.0"
                  }
                ],
                "appPermissions": {
                  "entitlements": [],
                  "privacy": {
                    "NSCameraUsageDescription": "QRコードを読み取って友だちを追加するために使用します"
                  }
                }
              }
            ],
            "news": []
          }
          EOF
          cat source.json

      - uses: actions/upload-artifact@v4
        with:
          name: Myne-ipa
          path: |
            Myne.ipa
            source.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Myne.ipa
            source.json
